# A Deployment with a plaintext high-entropy secret in an environment variable.
# The SecretScope webhook rejects this.
# TEST FIXTURE ONLY. Not a real credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsafe-generic
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unsafe-generic
  template:
    metadata:
      labels:
        app: unsafe-generic
    spec:
      containers:
        - name: app
          image: nginx:1.27
          env:
            - name: API_KEY
              value: "aB3xZ9qL7wR2tP5mN8kQ1vC4"
