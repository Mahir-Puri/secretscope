# SecretScope configuration for scanning this repository.
#
# Fail the scan when a finding reaches this severity.
severity_threshold = "medium"

# History scanning is opt-in per run; leave it off by default here.
scan_history = false

# Entropy cutoff (bits per character) for the generic detector.
entropy_threshold = 4.2

# Directories and file patterns that intentionally contain synthetic
# credentials for testing the tool. These are excluded so a self-scan stays
# meaningful. Everything else is scanned.
excluded_paths = ["fixtures", "target", "tests", "examples", "_test.go"]
