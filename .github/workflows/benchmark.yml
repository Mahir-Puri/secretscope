name: benchmark

# Benchmarks are noisy on shared runners, so they run only on demand.
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Run benchmark harness
        run: cargo run --release -p benchmarks | tee benchmark-results.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
