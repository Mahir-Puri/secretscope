[workspace]
resolver = "2"
members = [
    "crates/secretscope-scanner",
    "crates/secretscope-iam",
    "crates/secretscope-graph",
    "crates/secretscope-risk",
    "crates/secretscope-cli",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/example/secretscope"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"
walkdir = "2.4"
rayon = "=1.10.0"
anyhow = "1.0"
thiserror = "1.0"
zeroize = "=1.8.1"
once_cell = "1.19"
toml = "=0.8.8"
clap = { version = "=4.4.18", features = ["derive"] }
